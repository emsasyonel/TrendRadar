# TrendRadar - ULTIMATE BORSA & YAZILIM MODU
# Global Deney ve Finans Odaklı Ayarlar

app:
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  show_version_update: true

crawler:
  request_interval: 1000
  enable_crawler: true
  use_proxy: false
  default_proxy: "http://127.0.0.1:10086"

# --- RAPOR MODU: TEST İÇİN "CURRENT" ---
# Mesaj gelirse bunu sonra "incremental" yaparsın.
report:
  mode: "current"
  rank_threshold: 5

notification:
  enable_notification: true
  message_batch_size: 4000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━━━━"

  # Bildirim Saatleri (Kapalı, her an mesaj gelebilir)
  push_window:
    enabled: false
    time_range:
      start: "08:00"
      end: "23:00"

  # Webhook Ayarları (GitHub Secrets'tan okur)
  webhooks:
    feishu_url: ""
    dingtalk_url: ""
    wework_url: ""
    wework_msg_type: "markdown"
    telegram_bot_token: ""
    telegram_chat_id: ""
    email_from: ""
    email_password: ""
    email_to: ""
    ntfy_server_url: "https://ntfy.sh"
    ntfy_topic: ""
    ntfy_token: ""

weight:
  rank_weight: 0.5
  frequency_weight: 0.3
  hotness_weight: 0.2

# --- DEV PLATFORM LİSTESİ ---
platforms:
  # 1. Wallstreetcn (Global Finansın Kalbi - ABD/Çin/Kripto)
  # Buradan BTC, Tesla, Fed faiz kararları akar.
  - id: "wallstreetcn-hot"
    name: "WallSt-Global"

  # 2. Cailian Press (CLS) - (Reuters'ın Çin versiyonu gibidir, çok hızlıdır)
  - id: "cls-hot"
    name: "Finans-Flaş"

  # 3. Hacker News (Silikon Vadisi / Yazılımın Kalbi - İNGİLİZCE ŞANSIMIZ)
  - id: "hackernews"
    name: "HackerNews-USA"

  # 4. GitHub Trending (Yazılım Trendleri)
  - id: "github-trending"
    name: "GitHub-Trends"

  # 5. 36Kr (Teknoloji Yatırımları ve Startup)
  - id: "36kr"
    name: "Tech-Startup"

  # 6. ItHome (Teknoloji ve Donanım Haberleri)
  - id: "ithome"
    name: "IT-News"
