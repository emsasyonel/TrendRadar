# TrendRadar Configuration File

app:
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  show_version_update: true

crawler:
  request_interval: 1000
  enable_crawler: true
  use_proxy: false
  default_proxy: "http://127.0.0.1:10086"

# --- Rapor Modu ---
# daily: Günlük özet
# current: Anlık liste
# incremental: Sadece yeni haberler (Borsa için önerilen)
report:
  mode: "incremental"
  rank_threshold: 5

notification:
  enable_notification: true
  message_batch_size: 4000
  dingtalk_batch_size: 20000
  feishu_batch_size: 29000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━━━━"

  push_window:
    enabled: false
    time_range:
      start: "08:00"
      end: "22:00"
    once_per_day: true
    push_record_retention_days: 7

  # --- Webhook ve Token Ayarları (GitHub Secrets'tan Okur) ---
  webhooks:
    feishu_url: "${FEISHU_WEBHOOK_URL}"
    dingtalk_url: "${DINGTALK_WEBHOOK_URL}"
    wework_url: "${WEWORK_WEBHOOK_URL}"
    wework_msg_type: "markdown"
    
    # Telegram Ayarları (Secrets ile Bağlantılı)
    telegram_bot_token: "${TELEGRAM_BOT_TOKEN}"
    telegram_chat_id: "${TELEGRAM_CHAT_ID}"
    
    # Email Ayarları
    email_from: "${EMAIL_FROM}"
    email_password: "${EMAIL_PASSWORD}"
    email_to: "${EMAIL_TO}"
    email_smtp_server: "${EMAIL_SMTP_SERVER}"
    email_smtp_port: "${EMAIL_SMTP_PORT}"
    
    # Ntfy Ayarları
    ntfy_server_url: "${NTFY_SERVER_URL}"
    ntfy_topic: "${NTFY_TOPIC}"
    ntfy_token: "${NTFY_TOKEN}"

weight:
  rank_weight: 0.6
  frequency_weight: 0.3
  hotness_weight: 0.1

# --- Platform Listesi (Hizalaması Düzeltildi) ---
platforms:
  - id: "wallstreetcn-hot"
    name: "Wallstreetcn"
  
  - id: "yicai"
    name: "Yicai"
  
  - id: "36kr"
    name: "36Kr"
