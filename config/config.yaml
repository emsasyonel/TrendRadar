# TrendRadar - HYBRID MOD (Çin + Global)
# Hem Çin'in hızını hem Batı'nın yazılımını kapsar.

app:
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  show_version_update: true

crawler:
  request_interval: 1000
  enable_crawler: true
  use_proxy: false
  default_proxy: "http://127.0.0.1:10086"

# --- RAPOR MODU: ESKİ HALİNE (INCREMENTAL) GETİRİLDİ ---
# Artık sadece YENİ haber düştüğünde mesaj atacak.
# (Test bittiği için "current"tan vazgeçtik)
report:
  mode: "incremental"
  rank_threshold: 5

notification:
  enable_notification: true
  message_batch_size: 4000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━━━━"

  # Bildirim Saatleri (Kapalı, her an mesaj gelebilir)
  push_window:
    enabled: false
    time_range:
      start: "08:00"
      end: "23:00"

  # Webhook Ayarları (GitHub Secrets'tan okur - BOŞ BIRAKILDI)
  webhooks:
    feishu_url: ""
    dingtalk_url: ""
    wework_url: ""
    wework_msg_type: "markdown"
    telegram_bot_token: ""
    telegram_chat_id: ""
    email_from: ""
    email_password: ""
    email_to: ""
    ntfy_server_url: "https://ntfy.sh"
    ntfy_topic: ""
    ntfy_token: ""

weight:
  rank_weight: 0.5
  frequency_weight: 0.3
  hotness_weight: 0.2

# --- KARMA PLATFORM LİSTESİ (ÇİN + GLOBAL) ---
platforms:
  # --- 🇨🇳 ÇİN DEVLERİ (Hız ve Hacim) ---
  # 1. Wallstreetcn: Çin'in Bloomberg'i. Finans/Kripto için en hızlısı.
  - id: "wallstreetcn-hot"
    name: "Çin-Finans(WS)"

  # 2. Cailian Press: Reuters benzeri flaş haber servisi.
  - id: "cls-hot"
    name: "Çin-Flaş(CLS)"

  # 3. Baidu Hot Search: Çin'in Google'ı. En büyük genel trendler burada.
  # (Buradan genel dünya gündemi çok hızlı düşer)
  - id: "baidu"
    name: "Baidu-Genel"

  # 4. 36Kr: Çin'in TechCrunch'ı. Teknoloji ve Girişimcilik.
  - id: "36kr"
    name: "Çin-Tech(36Kr)"

  # --- 🇺🇸 GLOBAL / İNGİLİZCE (Yazılım ve Batı) ---
  # 5. Hacker News: Silikon Vadisi ve Yazılım dünyasının kalbi. (İngilizce)
  - id: "hackernews"
    name: "USA-HackerNews"

  # 6. GitHub Trending: Yazılım kütüphaneleri için. (Global)
  - id: "github-trending"
    name: "Global-GitHub"
